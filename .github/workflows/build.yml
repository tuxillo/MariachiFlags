name: Build iOS IPA

# Manual dispatch only — no automatic triggers
on:
  workflow_dispatch:

# One build at a time
concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15        # ships Xcode 16
    permissions:
      contents: read         # read-only access to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project MariachiFlags.xcodeproj \
            -scheme MariachiFlags \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Package as unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/derived" -name "MariachiFlags.app" | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/MariachiFlags-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MariachiFlags-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/MariachiFlags-unsigned.ipa
          retention-days: 30
