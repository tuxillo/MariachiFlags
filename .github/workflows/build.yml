name: Build iOS IPA

# Manual dispatch only — no automatic triggers
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (optional)"
        required: false
        default: ""

# One build at a time
concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15        # ships Xcode 16
    permissions:
      contents: write        # needed to create GitHub releases
      id-token: write        # needed to mint the OIDC token for attestation
      attestations: write    # needed to store the provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project MariachiFlags.xcodeproj \
            -scheme MariachiFlags \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Package as unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/derived" -name "MariachiFlags.app" | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/MariachiFlags-unsigned.ipa" Payload

      # Cryptographically links the IPA to this repo, workflow, and commit.
      # Anyone can verify with:
      #   gh attestation verify MariachiFlags-unsigned.ipa --repo <owner>/mariachiflags
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/MariachiFlags-unsigned.ipa

      - name: Create GitHub Release and attach IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +'%Y%m%d')-${{ github.run_number }}"
          TITLE="MariachiFlags $TAG"

          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Built from commit \`${{ github.sha }}\` via GitHub Actions run #${{ github.run_number }}.

          **Installation:** download the IPA below and install with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) (both re-sign locally with your free Apple ID — no paid developer account needed).

          **Verify this build came from this repo:**
          \`\`\`
          gh attestation verify MariachiFlags-unsigned.ipa --repo ${{ github.repository }}
          \`\`\`"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            "$RUNNER_TEMP/MariachiFlags-unsigned.ipa#MariachiFlags-unsigned.ipa"
