name: Build iOS IPA

# Manual dispatch only — no automatic triggers
on:
  workflow_dispatch:

# Prevent concurrent runs from stomping on each other's keychain/artifacts
concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Archive & Export IPA
    runs-on: macos-15        # Xcode 16 ships on macos-15
    # "release" environment requires a manual approval gate in repo settings
    environment: release

    # Limit what this job can do to the repo
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── Signing setup ─────────────────────────────────────────────────────
      # Secrets required (set in repo Settings → Secrets and variables → Actions):
      #
      #   DISTRIBUTION_CERTIFICATE_P12   – base64-encoded .p12 export of your
      #                                    Apple Distribution certificate
      #   DISTRIBUTION_CERTIFICATE_PASS  – password used when exporting the .p12
      #   PROVISIONING_PROFILE_BASE64    – base64-encoded .mobileprovision file
      #                                    (Ad Hoc profile listing target device UDIDs)
      #   EXPORT_OPTIONS_PLIST_BASE64    – base64-encoded ExportOptions.plist
      #                                    (see docs/ExportOptions.plist.example)
      #   KEYCHAIN_PASSWORD              – any strong random password, used only
      #                                    for the ephemeral build keychain

      - name: Create ephemeral keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Lock after 6 h (job will be long gone by then)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Make it the default so xcodebuild can find it
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASS: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASS }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASS" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # Allow codesign to access the key without UI prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          PP_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PP_BASE64" | base64 --decode > "$PP_PATH"
          # Xcode looks up profiles by UUID filename
          UUID=$(security cms -D -i "$PP_PATH" \
                  | plutil -extract UUID raw -)
          cp "$PP_PATH" "$PP_DIR/$UUID.mobileprovision"
          rm -f "$PP_PATH"

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Archive
        run: |
          xcodebuild archive \
            -project MariachiFlags.xcodeproj \
            -scheme MariachiFlags \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MariachiFlags.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            | xcpretty || true

      - name: Export IPA
        env:
          EXPORT_OPTIONS_BASE64: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          EXPORT_OPTS="$RUNNER_TEMP/ExportOptions.plist"
          echo "$EXPORT_OPTIONS_BASE64" | base64 --decode > "$EXPORT_OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MariachiFlags.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -exportPath "$RUNNER_TEMP/ipa" \
            | xcpretty || true
          rm -f "$EXPORT_OPTS"

      # ── Artifact ──────────────────────────────────────────────────────────

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MariachiFlags-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
          # Prevent other jobs/workflows from reading the artifact
          # (Actions artifacts are accessible to anyone with repo read access,
          #  so keep the repo private if the IPA should be restricted)

      # ── Cleanup ───────────────────────────────────────────────────────────
      # Runs even if earlier steps fail to ensure the keychain is never left behind

      - name: Delete ephemeral keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
